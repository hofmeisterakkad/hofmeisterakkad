<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="220"
  viewBox="0 0 1200 220"
  role="img"
  aria-labelledby="title description"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="title">Leon A. Hofmeister-Akkad</title>
  <desc id="description">
    Animated cyberpunk identity header.
  </desc>

  <defs>
    <linearGradient id="background-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12101c"/>
      <stop offset="100%" stop-color="#181126"/>
    </linearGradient>

    <linearGradient id="purple-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33205c" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#7c5cb3" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#33205c" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="scan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="4"
        result="blur"
      />
      <feFlood
        flood-color="#00d9ff"
        flood-opacity="0.32"
        result="color"
      />
      <feComposite
        in="color"
        in2="blur"
        operator="in"
        result="glow"
      />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="slice-top">
      <rect x="0" y="74" width="1200" height="17"/>
    </clipPath>

    <clipPath id="slice-middle">
      <rect x="0" y="101" width="1200" height="15"/>
    </clipPath>

    <clipPath id="slice-bottom">
      <rect x="0" y="128" width="1200" height="17"/>
    </clipPath>
  </defs>

  <style>
    .microtext {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #63838b;
    }

    .name {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;
      font-size: 55px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .name-main {
      fill: #f0f6fc;
      filter: url(#cyan-glow);
    }

    .name-cyan {
      fill: #00d9ff;
      opacity: 0;
      animation: cyan-glitch 9s steps(1, end) infinite;
    }

    .name-magenta {
      fill: #ff2f92;
      opacity: 0;
      animation: magenta-glitch 9s steps(1, end) infinite;
    }

    .glitch-slice {
      opacity: 0;
      animation: slice-visibility 9s steps(1, end) infinite;
    }

    .offset-top {
      animation: offset-top 9s steps(1, end) infinite;
    }

    .offset-middle {
      animation: offset-middle 9s steps(1, end) infinite;
    }

    .offset-bottom {
      animation: offset-bottom 9s steps(1, end) infinite;
    }

    .noise {
      opacity: 0;
      animation: noise-flicker 9s steps(1, end) infinite;
    }

    .scanline {
      opacity: 0;
      animation: scan-sweep 9s linear infinite;
    }

    .signal-stable {
      animation: stable-status 9s steps(1, end) infinite;
    }

    .signal-corrupt {
      fill: #ff2f92;
      opacity: 0;
      animation: corrupt-status 9s steps(1, end) infinite;
    }

    .pulse {
      animation: pulse-move 9s linear infinite;
    }

    @keyframes scan-sweep {
      0% {
        opacity: 0;
        transform: translateX(0);
      }

      2% {
        opacity: 0.60;
      }

      14% {
        opacity: 0;
        transform: translateX(1440px);
      }

      100% {
        opacity: 0;
        transform: translateX(1440px);
      }
    }

    @keyframes cyan-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.72;
        transform: translateX(-8px);
      }

      74% {
        opacity: 0.34;
        transform: translateX(5px);
      }

      75% {
        opacity: 0.68;
        transform: translateX(-4px);
      }

      76% {
        opacity: 0.25;
        transform: translateX(7px);
      }
    }

    @keyframes magenta-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.52;
        transform: translateX(8px);
      }

      74% {
        opacity: 0.70;
        transform: translateX(-5px);
      }

      75% {
        opacity: 0.42;
        transform: translateX(4px);
      }

      76% {
        opacity: 0.62;
        transform: translateX(-7px);
      }
    }

    @keyframes slice-visibility {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73%, 76% {
        opacity: 1;
      }
    }

    @keyframes offset-top {
      0%, 72%, 77%, 100% {
        transform: translateX(0);
      }

      73% {
        transform: translateX(18px);
      }

      74% {
        transform: translateX(-11px);
      }

      75% {
        transform: translateX(8px);
      }

      76% {
        transform: translateX(-15px);
      }
    }

    @keyframes offset-middle {
      0%, 72%, 77%, 100% {
        transform: translateX(0);
      }

      73% {
        transform: translateX(-14px);
      }

      74% {
        transform: translateX(17px);
      }

      75% {
        transform: translateX(-6px);
      }

      76% {
        transform: translateX(11px);
      }
    }

    @keyframes offset-bottom {
      0%, 72%, 77%, 100% {
        transform: translateX(0);
      }

      73% {
        transform: translateX(10px);
      }

      74% {
        transform: translateX(-17px);
      }

      75% {
        transform: translateX(13px);
      }

      76% {
        transform: translateX(-8px);
      }
    }

    @keyframes noise-flicker {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73% {
        opacity: 0.85;
      }

      74% {
        opacity: 0.35;
      }

      75% {
        opacity: 1;
      }

      76% {
        opacity: 0.50;
      }
    }

    @keyframes stable-status {
      0%, 72%, 77%, 100% {
        opacity: 1;
      }

      73%, 76% {
        opacity: 0;
      }
    }

    @keyframes corrupt-status {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73%, 76% {
        opacity: 1;
      }
    }

    @keyframes pulse-move {
      0% {
        transform: translateX(-100px);
        opacity: 0;
      }

      4% {
        opacity: 1;
      }

      18% {
        transform: translateX(1240px);
        opacity: 0;
      }

      100% {
        transform: translateX(1240px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .name-cyan,
      .name-magenta,
      .glitch-slice,
      .noise,
      .scanline,
      .signal-stable,
      .signal-corrupt,
      .pulse {
        animation: none;
      }

      .name-cyan,
      .name-magenta,
      .glitch-slice,
      .noise,
      .signal-corrupt {
        opacity: 0;
      }

      .signal-stable {
        opacity: 1;
      }
    }
  </style>

  <rect
    width="1200"
    height="220"
    rx="14"
    fill="url(#background-gradient)"
  />

  <!-- Angular background geometry -->
  <path
    d="M0 0 H700 L500 220 H0 Z"
    fill="#33205c"
    opacity="0.20"
  />

  <path
    d="M430 0 H1200 V116 L865 220 H690 Z"
    fill="url(#purple-gradient)"
  />

  <path
    d="M0 182 L300 155 L590 190 L910 152 L1200 181 V220 H0 Z"
    fill="#7c5cb3"
    opacity="0.10"
  />

  <!-- Frame lines -->
  <path
    d="M42 39 H1158"
    stroke="#1b3b46"
    stroke-width="1"
  />

  <path
    d="M42 181 H1158"
    stroke="#392753"
    stroke-width="1"
  />

  <!-- Header labels -->
  <text class="microtext" x="50" y="28">
    IDENTITY // 01
  </text>

  <text
    class="microtext signal-stable"
    x="1150"
    y="28"
    text-anchor="end"
  >
    SIGNAL: ACQUIRED
  </text>

  <text
    class="microtext signal-corrupt"
    x="1150"
    y="28"
    text-anchor="end"
  >
    SIGNAL: CORRUPT
  </text>

  <!-- Sweeping acquisition scan -->
  <rect
    class="scanline"
    x="-220"
    y="0"
    width="180"
    height="220"
    fill="url(#scan-gradient)"
  />

  <!-- Stable name -->
  <text class="name name-main" x="600" y="111">
    Leon A. Hofmeister-Akkad
  </text>

  <!-- RGB channel split during corruption -->
  <text class="name name-cyan" x="600" y="111">
    Leon A. Hofmeister-Akkad
  </text>

  <text class="name name-magenta" x="600" y="111">
    Leon A. Hofmeister-Akkad
  </text>

  <!-- Displaced horizontal slices -->
  <g
    class="glitch-slice"
    clip-path="url(#slice-top)"
  >
    <g class="offset-top">
      <text class="name name-main" x="600" y="111">
        Leon A. Hofmeister-Akkad
      </text>
    </g>
  </g>

  <g
    class="glitch-slice"
    clip-path="url(#slice-middle)"
  >
    <g class="offset-middle">
      <text class="name name-main" x="600" y="111">
        Leon A. Hofmeister-Akkad
      </text>
    </g>
  </g>

  <g
    class="glitch-slice"
    clip-path="url(#slice-bottom)"
  >
    <g class="offset-bottom">
      <text class="name name-main" x="600" y="111">
        Leon A. Hofmeister-Akkad
      </text>
    </g>
  </g>

  <!-- Small glitch fragments -->
  <g class="noise">
    <rect x="205" y="83" width="118" height="2" fill="#00d9ff"/>
    <rect x="768" y="98" width="172" height="3" fill="#ff2f92"/>
    <rect x="374" y="135" width="91" height="2" fill="#f0f6fc"/>
    <rect x="635" y="126" width="133" height="2" fill="#00d9ff"/>
    <rect x="912" y="144" width="78" height="3" fill="#ff2f92"/>
  </g>

  <!-- Bottom signal trace -->
  <path
    d="M50 197 H1150"
    stroke="#183641"
    stroke-width="1"
  />

  <g class="pulse">
    <rect
      x="-80"
      y="195"
      width="74"
      height="3"
      fill="#00d9ff"
      opacity="0.85"
    />
    <rect
      x="-22"
      y="194"
      width="6"
      height="5"
      fill="#f0f6fc"
    />
  </g>
</svg>
