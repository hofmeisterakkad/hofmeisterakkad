<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Leon A. Hofmeister-Akkad — Sic Parvis Magna
  </title>

  <desc id="description">
    Animated profile header with synchronized glitch effects.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#0d1117"
      />

      <stop
        offset="55%"
        stop-color="#141020"
      />

      <stop
        offset="100%"
        stop-color="#1b112a"
      />
    </linearGradient>

    <linearGradient
      id="purple-light"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#33205c"
        stop-opacity="0.12"
      />

      <stop
        offset="55%"
        stop-color="#7c5cb3"
        stop-opacity="0.34"
      />

      <stop
        offset="100%"
        stop-color="#33205c"
        stop-opacity="0.08"
      />
    </linearGradient>

    <!--
      Decorative divider line:
      invisible at both edges and strongest near the centre.
    -->
    <linearGradient
      id="line-fade"
      gradientUnits="userSpaceOnUse"
      x1="42"
      y1="0"
      x2="1158"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#00d9ff"
        stop-opacity="0"
      />

      <stop
        offset="10%"
        stop-color="#00d9ff"
        stop-opacity="0.18"
      />

      <stop
        offset="35%"
        stop-color="#00d9ff"
        stop-opacity="0.32"
      />

      <stop
        offset="50%"
        stop-color="#7c5cb3"
        stop-opacity="0.36"
      />

      <stop
        offset="65%"
        stop-color="#00d9ff"
        stop-opacity="0.32"
      />

      <stop
        offset="90%"
        stop-color="#00d9ff"
        stop-opacity="0.18"
      />

      <stop
        offset="100%"
        stop-color="#00d9ff"
        stop-opacity="0"
      />
    </linearGradient>

    <linearGradient
      id="scan-gradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#00d9ff"
        stop-opacity="0"
      />

      <stop
        offset="50%"
        stop-color="#00d9ff"
        stop-opacity="0.18"
      />

      <stop
        offset="100%"
        stop-color="#00d9ff"
        stop-opacity="0"
      />
    </linearGradient>

    <filter
      id="text-glow"
      x="-25%"
      y="-100%"
      width="150%"
      height="300%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="4"
        result="blur"
      />

      <feFlood
        flood-color="#00d9ff"
        flood-opacity="0.28"
        result="color"
      />

      <feComposite
        in="color"
        in2="blur"
        operator="in"
        result="glow"
      />

      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Additional displaced fragments during the glitch. -->
    <clipPath id="glitch-slices">
      <rect
        x="0"
        y="92"
        width="1200"
        height="16"
      />

      <rect
        x="0"
        y="126"
        width="1200"
        height="14"
      />

      <rect
        x="0"
        y="176"
        width="1200"
        height="12"
      />

      <rect
        x="0"
        y="198"
        width="1200"
        height="11"
      />
    </clipPath>
  </defs>

  <style>
    .microtext {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #718b92;
    }

    .name {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 53px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .motto {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 8px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .main-text {
      fill: #f0f6fc;
      filter: url(#text-glow);
    }

    /*
      Name and motto are inside the same animated groups,
      so their glitches are phase-aligned.
    */
    .cyan-channel {
      fill: #00d9ff;
      opacity: 0;
      animation:
        cyan-glitch 9s steps(1, end) infinite;
    }

    .magenta-channel {
      fill: #ff2f92;
      opacity: 0;
      animation:
        magenta-glitch 9s steps(1, end) infinite;
    }

    .glitch-slices {
      opacity: 0;
      animation:
        glitch-window 9s steps(1, end) infinite;
    }

    .slice-offset {
      animation:
        slice-offset 9s steps(1, end) infinite;
    }

    .noise {
      opacity: 0;
      animation:
        noise-window 9s steps(1, end) infinite;
    }

    .scanline {
      opacity: 0;
      animation:
        scan-sweep 9s linear infinite;
    }

    .pulse {
      opacity: 0;
      animation:
        pulse-sweep 9s linear infinite;
    }

    .status-stable {
      animation:
        stable-status 9s steps(1, end) infinite;
    }

    .status-corrupt {
      fill: #ff2f92;
      opacity: 0;
      animation:
        corrupt-status 9s steps(1, end) infinite;
    }

    @keyframes cyan-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.72;
        transform: translateX(-8px);
      }

      74% {
        opacity: 0.32;
        transform: translateX(5px);
      }

      75% {
        opacity: 0.66;
        transform: translateX(-4px);
      }

      76% {
        opacity: 0.24;
        transform: translateX(7px);
      }
    }

    @keyframes magenta-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.52;
        transform: translateX(8px);
      }

      74% {
        opacity: 0.70;
        transform: translateX(-5px);
      }

      75% {
        opacity: 0.42;
        transform: translateX(4px);
      }

      76% {
        opacity: 0.60;
        transform: translateX(-7px);
      }
    }

    @keyframes glitch-window {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73%, 76% {
        opacity: 1;
      }
    }

    @keyframes slice-offset {
      0%, 72%, 77%, 100% {
        transform: translateX(0);
      }

      73% {
        transform: translateX(17px);
      }

      74% {
        transform: translateX(-11px);
      }

      75% {
        transform: translateX(8px);
      }

      76% {
        transform: translateX(-14px);
      }
    }

    @keyframes noise-window {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73% {
        opacity: 0.86;
      }

      74% {
        opacity: 0.28;
      }

      75% {
        opacity: 1;
      }

      76% {
        opacity: 0.44;
      }
    }

    @keyframes scan-sweep {
      0% {
        opacity: 0;
        transform: translateX(-220px);
      }

      2% {
        opacity: 0.50;
      }

      14% {
        opacity: 0;
        transform: translateX(1420px);
      }

      100% {
        opacity: 0;
        transform: translateX(1420px);
      }
    }

    @keyframes pulse-sweep {
      0% {
        opacity: 0;
        transform: translateX(-120px);
      }

      3% {
        opacity: 1;
      }

      19% {
        opacity: 0.85;
        transform: translateX(1260px);
      }

      23% {
        opacity: 0;
        transform: translateX(1320px);
      }

      100% {
        opacity: 0;
        transform: translateX(1320px);
      }
    }

    @keyframes stable-status {
      0%, 72%, 77%, 100% {
        opacity: 1;
      }

      73%, 76% {
        opacity: 0;
      }
    }

    @keyframes corrupt-status {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73%, 76% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cyan-channel,
      .magenta-channel,
      .glitch-slices,
      .noise,
      .scanline,
      .pulse,
      .status-corrupt {
        animation: none;
        opacity: 0;
      }

      .status-stable {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Background -->
  <rect
    width="1200"
    height="250"
    rx="14"
    fill="url(#background)"
  />

  <!-- Restrained angular geometry -->
  <path
    d="
      M0 0
      H700
      L500 250
      H0
      Z
    "
    fill="#33205c"
    opacity="0.18"
  />

  <path
    d="
      M430 0
      H1200
      V123
      L865 250
      H700
      Z
    "
    fill="url(#purple-light)"
  />

  <path
    d="
      M0 205
      L300 180
      L590 217
      L910 176
      L1200 208
      V250
      H0
      Z
    "
    fill="#7c5cb3"
    opacity="0.09"
  />

  <!--
    Only one top divider and one bottom divider remain.
    The former purple line has been removed.
  -->
  <path
    d="M42 43H1158"
    fill="none"
    stroke="url(#line-fade)"
    stroke-width="1"
  />

  <path
    d="M42 226H1158"
    fill="none"
    stroke="url(#line-fade)"
    stroke-width="1"
  />

  <!-- Labels -->
  <text
    class="microtext"
    x="50"
    y="31"
  >
    IDENTITY // 01
  </text>

  <text
    class="microtext status-stable"
    x="1150"
    y="31"
    text-anchor="end"
  >
    SIGNAL: ACQUIRED
  </text>

  <text
    class="microtext status-corrupt"
    x="1150"
    y="31"
    text-anchor="end"
  >
    SIGNAL: CORRUPT
  </text>

  <!-- Subtle scan -->
  <rect
    class="scanline"
    x="-220"
    y="0"
    width="180"
    height="250"
    fill="url(#scan-gradient)"
  />

  <!-- Stable name and motto -->
  <text
    class="name main-text"
    x="600"
    y="124"
  >
    Leon A. Hofmeister-Akkad
  </text>

  <text
    class="motto main-text"
    x="600"
    y="193"
  >
    SIC PARVIS MAGNA
  </text>

  <!-- Synchronized cyan split -->
  <g class="cyan-channel">
    <text
      class="name"
      x="600"
      y="124"
    >
      Leon A. Hofmeister-Akkad
    </text>

    <text
      class="motto"
      x="600"
      y="193"
    >
      SIC PARVIS MAGNA
    </text>
  </g>

  <!-- Synchronized magenta split -->
  <g class="magenta-channel">
    <text
      class="name"
      x="600"
      y="124"
    >
      Leon A. Hofmeister-Akkad
    </text>

    <text
      class="motto"
      x="600"
      y="193"
    >
      SIC PARVIS MAGNA
    </text>
  </g>

  <!-- Synchronized displaced slices -->
  <g
    class="glitch-slices"
    clip-path="url(#glitch-slices)"
  >
    <g class="slice-offset">
      <text
        class="name main-text"
        x="600"
        y="124"
      >
        Leon A. Hofmeister-Akkad
      </text>

      <text
        class="motto main-text"
        x="600"
        y="193"
      >
        SIC PARVIS MAGNA
      </text>
    </g>
  </g>

  <!-- Brief corruption fragments -->
  <g class="noise">
    <rect
      x="175"
      y="95"
      width="104"
      height="2"
      fill="#00d9ff"
    />

    <rect
      x="760"
      y="116"
      width="151"
      height="3"
      fill="#ff2f92"
    />

    <rect
      x="338"
      y="148"
      width="76"
      height="2"
      fill="#f0f6fc"
    />

    <rect
      x="642"
      y="137"
      width="129"
      height="2"
      fill="#00d9ff"
    />

    <rect
      x="470"
      y="201"
      width="89"
      height="2"
      fill="#ff2f92"
    />

    <rect
      x="707"
      y="187"
      width="94"
      height="2"
      fill="#00d9ff"
    />
  </g>

  <!-- Small moving pulse on the bottom divider -->
  <g class="pulse">
    <rect
      x="-90"
      y="224.5"
      width="72"
      height="3"
      fill="#00d9ff"
      opacity="0.78"
    />

    <rect
      x="-23"
      y="222"
      width="6"
      height="8"
      fill="#f0f6fc"
      opacity="0.75"
    />

    <rect
      x="-17"
      y="224.5"
      width="12"
      height="3"
      fill="#7c5cb3"
      opacity="0.78"
    />
  </g>
</svg>
