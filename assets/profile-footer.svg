<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="92"
  viewBox="0 0 1200 92"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">End of transmission</title>

  <desc id="description">
    Animated profile footer with fading signal lines and a brief glitch.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#0d1117"
      />

      <stop
        offset="50%"
        stop-color="#141020"
      />

      <stop
        offset="100%"
        stop-color="#0d1117"
      />
    </linearGradient>

    <!-- Cyan-to-violet color of the divider. -->
    <linearGradient
      id="divider-color"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="0"
      x2="1200"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#00d9ff"
      />

      <stop
        offset="50%"
        stop-color="#7c5cb3"
      />

      <stop
        offset="100%"
        stop-color="#00d9ff"
      />
    </linearGradient>

    <!-- Wide opacity fade used by the line and moving pulse. -->
    <linearGradient
      id="edge-opacity"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="black"
      />

      <stop
        offset="22%"
        stop-color="white"
      />

      <stop
        offset="78%"
        stop-color="white"
      />

      <stop
        offset="100%"
        stop-color="black"
      />
    </linearGradient>

    <mask
      id="edge-fade-mask"
      maskUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="1200"
      height="92"
    >
      <rect
        x="0"
        y="0"
        width="1200"
        height="92"
        fill="url(#edge-opacity)"
      />
    </mask>

    <!-- Purple geometry also disappears toward both edges. -->
    <linearGradient
      id="terrain-fade"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="0"
      x2="1200"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#33205c"
        stop-opacity="0"
      />

      <stop
        offset="16%"
        stop-color="#33205c"
        stop-opacity="0.15"
      />

      <stop
        offset="50%"
        stop-color="#7c5cb3"
        stop-opacity="0.22"
      />

      <stop
        offset="84%"
        stop-color="#33205c"
        stop-opacity="0.15"
      />

      <stop
        offset="100%"
        stop-color="#33205c"
        stop-opacity="0"
      />
    </linearGradient>

    <filter
      id="pulse-glow"
      x="-80%"
      y="-300%"
      width="260%"
      height="700%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .label {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.4px;
      text-anchor: middle;
      fill: #8ea0a5;
    }

    .cyan-channel {
      fill: #00d9ff;
      opacity: 0;
      animation:
        cyan-glitch 9s steps(1, end) infinite;
    }

    .magenta-channel {
      fill: #ff2f92;
      opacity: 0;
      animation:
        magenta-glitch 9s steps(1, end) infinite;
    }

    .noise {
      opacity: 0;
      animation:
        noise-window 9s steps(1, end) infinite;
    }

    .pulse {
      opacity: 0;
      animation:
        pulse-sweep 9s linear infinite;
    }

    @keyframes pulse-sweep {
      0% {
        opacity: 0;
        transform: translateX(-130px);
      }

      3% {
        opacity: 1;
      }

      20% {
        opacity: 0.85;
        transform: translateX(1260px);
      }

      24% {
        opacity: 0;
        transform: translateX(1320px);
      }

      100% {
        opacity: 0;
        transform: translateX(1320px);
      }
    }

    @keyframes cyan-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.65;
        transform: translateX(-5px);
      }

      74% {
        opacity: 0.28;
        transform: translateX(3px);
      }

      75% {
        opacity: 0.58;
        transform: translateX(-2px);
      }

      76% {
        opacity: 0.20;
        transform: translateX(4px);
      }
    }

    @keyframes magenta-glitch {
      0%, 72%, 77%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      73% {
        opacity: 0.45;
        transform: translateX(5px);
      }

      74% {
        opacity: 0.60;
        transform: translateX(-3px);
      }

      75% {
        opacity: 0.35;
        transform: translateX(2px);
      }

      76% {
        opacity: 0.50;
        transform: translateX(-4px);
      }
    }

    @keyframes noise-window {
      0%, 72%, 77%, 100% {
        opacity: 0;
      }

      73% {
        opacity: 0.82;
      }

      74% {
        opacity: 0.28;
      }

      75% {
        opacity: 1;
      }

      76% {
        opacity: 0.42;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cyan-channel,
      .magenta-channel,
      .noise,
      .pulse {
        animation: none;
        opacity: 0;
      }
    }
  </style>

  <!-- Background -->
  <rect
    width="1200"
    height="92"
    rx="12"
    fill="url(#background)"
  />

  <!-- Single angular terrain layer; no stroke and no duplicate path. -->
  <path
    d="
      M0 66
      L235 57
      L430 70
      L640 68
      L850 54
      L1025 64
      L1200 58
      V92
      H0
      Z
    "
    fill="url(#terrain-fade)"
  />

  <!-- Divider with a clearly visible edge fade. -->
  <g mask="url(#edge-fade-mask)">
    <path
      d="M0 24H1200"
      fill="none"
      stroke="url(#divider-color)"
      stroke-width="1"
      opacity="0.42"
    />
  </g>

  <!-- Stable terminal label -->
  <text
    class="label"
    x="600"
    y="62"
  >
    END OF TRANSMISSION // EXIT 0
  </text>

  <!-- Brief synchronized RGB split of the label -->
  <text
    class="label cyan-channel"
    x="600"
    y="62"
  >
    END OF TRANSMISSION // EXIT 0
  </text>

  <text
    class="label magenta-channel"
    x="600"
    y="62"
  >
    END OF TRANSMISSION // EXIT 0
  </text>

  <!-- Moving pulse uses the same fade mask. -->
  <g mask="url(#edge-fade-mask)">
    <g
      class="pulse"
      filter="url(#pulse-glow)"
    >
      <rect
        x="-98"
        y="22.5"
        width="76"
        height="3"
        fill="#00d9ff"
        opacity="0.78"
      />

      <path
        d="
          M-25 24
          H-16
          L-11 14
          L-4 34
          L3 18
          L10 24
          H28
        "
        fill="none"
        stroke="#00d9ff"
        stroke-width="2"
        stroke-linejoin="round"
      />

      <circle
        cx="31"
        cy="24"
        r="2.5"
        fill="#f0f6fc"
      />
    </g>
  </g>

  <!-- Brief corruption fragments -->
  <g class="noise">
    <rect
      x="305"
      y="52"
      width="69"
      height="2"
      fill="#00d9ff"
    />

    <rect
      x="760"
      y="64"
      width="97"
      height="2"
      fill="#ff2f92"
    />

    <rect
      x="523"
      y="73"
      width="65"
      height="2"
      fill="#f0f6fc"
    />
  </g>
</svg>
